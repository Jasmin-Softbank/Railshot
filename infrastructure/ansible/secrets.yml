---
- name: Configure and verify the registered secrets runtime
  hosts: k3s_server
  gather_facts: false
  become: true
  vars:
    railshot_remote_root: /var/lib/railshot/secrets-runtime
  tasks:
    - name: Install recovery envelope cryptography support
      ansible.builtin.package:
        name: python3-cryptography
        state: present
    - name: Stage, execute and always clean private secrets material
      block:
        - name: Create private staging directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - {path: /usr/local/libexec, mode: "0755"}
            - {path: /etc/railshot, mode: "0700"}
            - {path: "{{ railshot_remote_root }}", mode: "0700"}

        - name: Install fixed recovery escrow helper
          ansible.builtin.copy:
            src: "{{ railshot_recovery_helper_source }}"
            dest: /usr/local/libexec/railshot-recovery-escrow
            owner: root
            group: root
            mode: "0755"

        - name: Stage public runtime artifacts
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ railshot_remote_root }}/{{ item.dest }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - {src: "{{ railshot_runtime_source }}", dest: secrets_runtime.py}
            - {src: "{{ railshot_storage_manifest_source }}", dest: storage.yaml}
            - {src: "{{ railshot_eso_manifest_source }}", dest: external-secrets.yaml}
            - {src: "{{ railshot_tls_cert_source }}", dest: tls.crt}
            - {src: "{{ railshot_tls_ca_source }}", dest: ca.crt}
            - {src: "{{ railshot_escrow_ca_source }}", dest: escrow-ca.crt}
            - {src: "{{ railshot_escrow_cert_source }}", dest: escrow-client.crt}

        - name: Stage private runtime artifacts
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          loop:
            - {src: "{{ railshot_tls_key_source }}", dest: "{{ railshot_remote_root }}/tls.key"}
            - {src: "{{ railshot_seal_env_source }}", dest: "{{ railshot_remote_root }}/seal.json"}
            - {src: "{{ railshot_escrow_key_source }}", dest: "{{ railshot_remote_root }}/escrow-client.key"}
            - {src: "{{ railshot_profile_source }}", dest: "{{ railshot_remote_root }}/profile.json"}
            - {src: "{{ railshot_escrow_config_source }}", dest: /etc/railshot/recovery-escrow.json}

        - name: Stage the separately trusted central Transit CA
          ansible.builtin.copy:
            src: "{{ railshot_transit_ca_source }}"
            dest: "{{ railshot_remote_root }}/transit-ca.crt"
            owner: root
            group: root
            mode: "0644"
          when: railshot_transit_ca_source is not none

        - name: Execute bounded secrets phase without exposing command output
          ansible.builtin.command:
            argv:
              - python3
              - "{{ railshot_remote_root }}/secrets_runtime.py"
              - --config
              - "{{ railshot_remote_root }}/profile.json"
              - --storage-manifest
              - "{{ railshot_remote_root }}/storage.yaml"
              - --eso-manifest
              - "{{ railshot_remote_root }}/external-secrets.yaml"
              - --environment-id
              - "{{ railshot_target_id }}"
              - --provider
              - "{{ railshot_provider }}"
              - --phase
              - "{{ railshot_secrets_phase }}"
              - --request-id
              - "{{ railshot_request_id }}"
              - --node-id
              - "{{ k3s_node_name }}"
              - --nonce
              - "{{ railshot_nonce }}"
              - --receipt
              - "{{ railshot_remote_root }}/receipt.json"
          register: railshot_secrets_execution
          failed_when: false
          no_log: true
          changed_when: railshot_secrets_phase == 'configure'

        - name: Check whether the metadata receipt exists
          ansible.builtin.stat:
            path: "{{ railshot_remote_root }}/receipt.json"
          register: railshot_secrets_receipt

        - name: Fetch metadata-only secrets receipt after every known result
          ansible.builtin.fetch:
            src: "{{ railshot_remote_root }}/receipt.json"
            dest: "{{ railshot_receipt_path }}"
            flat: true
          when: railshot_secrets_receipt.stat.exists
          no_log: true

        - name: Propagate the phase result after preserving its receipt
          ansible.builtin.assert:
            that:
              - railshot_secrets_execution.rc == 0
              - railshot_secrets_receipt.stat.exists
            fail_msg: Secrets phase did not establish readiness; inspect the metadata-only receipt.
      always:
        - name: Remove all staged private material and escrow client configuration
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          no_log: true
          loop:
            - "{{ railshot_remote_root }}"
            - /etc/railshot/recovery-escrow.json
