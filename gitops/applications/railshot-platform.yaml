# Set the exact reviewed config commit before applying. No auto-sync or prune.
# Only rendered workload.json belongs in gitops/applications/railshot-platform/.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: railshot-platform, namespace: argocd}
spec:
  sourceRepos: [https://github.com/Jasmin-Softbank/Railshot.git]
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: railshot-system}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: '', kind: Service}
    - {group: networking.k8s.io, kind: NetworkPolicy}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: railshot-platform, namespace: argocd}
spec:
  project: railshot-platform
  source:
    repoURL: https://github.com/Jasmin-Softbank/Railshot.git
    targetRevision: REPLACE_WITH_REVIEWED_CONFIG_COMMIT
    path: gitops/applications/railshot-platform
    directory: {include: workload.json}
  destination: {server: 'https://kubernetes.default.svc', namespace: railshot-system}
