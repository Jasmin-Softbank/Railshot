# Fresh operations cluster only. Existing Argo CD is reused, not reinstalled.
# Argo CD v3.5.3 at an exact upstream commit; official container manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/c9c369efcc5b2a0bd720803f8d14a1c3eaddf579/manifests/install.yaml
replicas:
  # No SSO connector, ApplicationSets, notification config or subscriptions.
  - name: argocd-dex-server
    count: 0
  - name: argocd-applicationset-controller
    count: 0
  - name: argocd-notifications-controller
    count: 0
patches:
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {cpu: 500m, memory: 512Mi}
                  limits: {memory: 2Gi}
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 200m, memory: 256Mi}
                  limits: {memory: 1Gi}
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {memory: 512Mi}
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {cpu: 50m, memory: 128Mi}
                  limits: {memory: 256Mi}
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        controller.resource.health.persist: "true"
  - target:
      group: apps
      version: v1
      kind: (Deployment|StatefulSet)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          railshot.io/node-role: platform-worker
