name: Platform containers

on:
  workflow_call:
    inputs:
      components:
        type: string
        default: '["dashboard","api","mcp","ci-runner"]'
      export_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      components:
        description: JSON array of components to build
        type: string
        default: '["dashboard","api","mcp","ci-runner"]'

permissions: {contents: read}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Validate local application environment
        if: matrix.component == 'api'
        env:
          RAILSHOT_API_TOKEN_PATH: /tmp/railshot-test-token-not-installed
        run: docker compose -f deployment/compose.yaml --profile mcp config --quiet
      - name: Validate dedicated runner environment
        if: matrix.component == 'ci-runner'
        env:
          RAILSHOT_RUNNER_URL: https://github.com/Jasmin-Softbank/railshot-apps
          RAILSHOT_RUNNER_NAME: config-check-only
          RAILSHOT_RUNNER_TOKEN_FILE: /tmp/railshot-registration-token-not-installed
        run: docker compose -f ci/runner-compose.yml config --quiet
      - name: Build without credentials
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            dashboard) dockerfile=apps/dashboard/Dockerfile; target=dashboard ;;
            api|mcp) dockerfile=apps/api/Dockerfile; target="$COMPONENT" ;;
            ci-runner) dockerfile=ci/scripts/runner/Dockerfile; target=runner ;;
            *) echo "Unsupported component" >&2; exit 1 ;;
          esac
          docker build --pull --platform linux/amd64 --file "$dockerfile" --target "$target" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "railshot/$COMPONENT:ci" .
      - name: Run the built image without cloud or GitHub credentials
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/scripts/container-smoke.py "$COMPONENT" "railshot/$COMPONENT:ci"
      - name: Preserve exact tested image for publication
        if: inputs.export_image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker save "railshot/$COMPONENT:ci" | gzip > tested-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.export_image
        with:
          name: tested-image-${{ matrix.component }}
          path: tested-image.tar.gz
          if-no-files-found: error
          retention-days: 1
